<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netflix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Crect width='10' height='10' fill='%23141414'/%3E%3Cpath d='M3 1.5v7M7 1.5v7M3 1.5l4 7' stroke='%23e50914' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#141414;--red:#e50914;--pad:4vw;--gap:.45rem;--per:7;--pt:4;--nav:4.2rem}
@media(max-width:1400px){:root{--per:6}}
@media(max-width:1100px){:root{--per:5;--pt:3}}
@media(max-width:800px){:root{--per:4}}
@media(max-width:600px){:root{--per:3;--pt:2;--nav:3.4rem}}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(13px,.78vw + 5px,24px);background:var(--bg);scrollbar-width:none}
::-webkit-scrollbar{display:none}
body{background:var(--bg);color:#e5e5e5;font-family:"Netflix Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
:focus{outline:0}
[data-f]:focus-visible{outline:3px solid #fff;outline-offset:2px}
svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor;stroke:none}
.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}
#app.on{display:block;position:static}
.lw{--h:1.7rem;height:var(--h);display:flex;align-items:center}
.lw img{height:100%;width:auto}
.wm{font-family:'Bebas Neue',Impact,sans-serif;color:var(--red);font-size:calc(var(--h)*1.5);letter-spacing:.04em}
#load{background:#000;z-index:999;align-items:center;justify-content:center}
#load .lw{--h:9rem;animation:none}
@keyframes zl{from{transform:scale(.8);opacity:0}50%{opacity:1}to{transform:scale(1)}}
.spin{position:absolute;bottom:15vh;width:3rem;height:3rem;border:4px solid rgba(255,255,255,.15);border-left-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#prof{background:var(--bg);flex-direction:column;align-items:center;justify-content:center;z-index:500}
#prof .lw{--h:3rem;position:absolute;top:2rem;left:var(--pad)}
#prof h1{font-size:clamp(1.8rem,3.5vw,3.4rem);font-weight:400;margin-bottom:2rem}
.pg{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center;margin-bottom:3rem}
.pi{display:flex;flex-direction:column;align-items:center;width:10vw;min-width:5.5rem;max-width:11rem;color:grey}
.av{width:100%;aspect-ratio:1;border-radius:.25rem;overflow:hidden;position:relative;display:grid;place-items:center;border:3px solid transparent;font-size:3rem;font-weight:700;color:#fff}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pi span{margin-top:.8rem;font-size:1.1rem}
.pi:hover,.pi:focus{color:#fff}.pi:hover .av,.pi:focus .av{border-color:#fff}
.bm{border:1px solid grey;color:grey;padding:.6rem 1.6rem;letter-spacing:.15em;text-transform:uppercase;font-size:.9rem}
.bm:hover,.bm:focus{color:#fff;border-color:#fff}
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:100;display:flex;align-items:center;gap:1.6rem;padding:0 var(--pad);background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);transition:background-color .4s}
.nav.solid{background:var(--bg)}
.nav .lw{--h:1.8rem;margin-right:.6rem}
.nl{font-size:.82rem;padding:.4rem 0;white-space:nowrap}
.nl:hover{color:#b3b3b3}.nl.on{color:#fff;font-weight:700}
.nr{margin-left:auto;display:flex;align-items:center;gap:1.2rem}
.sb{display:flex;align-items:center;gap:.4rem;border:1px solid transparent;padding:.3rem .4rem}
.sb.open{border-color:#fff;background:rgba(0,0,0,.75)}
.sb input{width:0;background:none;border:0;color:#fff;font:inherit;font-size:.85rem;transition:width .3s}
.sb.open input{width:13rem}
.hm{position:relative;padding:.9rem 0}
.hm>button{display:flex;align-items:center;gap:.4rem}
.hm .av{width:2rem;height:2rem;font-size:1rem;border:0;border-radius:.2rem}
.mn{position:absolute;right:0;top:100%;min-width:12rem;background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.15);display:none;padding:.4rem 0}
.hm.open .mn{display:block}
.mn button{display:flex;width:100%;align-items:center;gap:.7rem;padding:.55rem 1rem;font-size:.82rem;text-align:left}
.mn button:hover,.mn button:focus{text-decoration:underline}
.mn .av{width:1.8rem;height:1.8rem;font-size:.9rem}
.mn hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:.4rem 0}
.hero{position:relative;height:56.25vw;max-height:100vh;min-height:28rem;overflow:hidden;background:#1a1a1a}
.hero-slides{position:absolute;inset:0;z-index:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.hero-slide.on{opacity:1}
.hero-slide img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.65),transparent 70%);z-index:1}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16vw;background:linear-gradient(transparent,rgba(20,20,20,.7) 40%,var(--bg));z-index:1}
.hi{position:absolute;z-index:2;left:var(--pad);bottom:35%;width:38%;min-width:17rem}
.tag{display:flex;align-items:center;gap:.5rem;font-weight:700;letter-spacing:.3em;font-size:.8rem;color:#ccc}
.tag b{font-family:'Bebas Neue',Impact,sans-serif;color:var(--red);font-size:1.8rem;letter-spacing:0;font-weight:400}
.ht{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(3rem,5.4vw,8rem);line-height:.92;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 .2rem 1rem rgba(0,0,0,.6);margin:.2rem 0 .6rem}
.rk{display:flex;align-items:center;gap:.6rem;font-size:1.2rem;font-weight:700;margin-bottom:.7rem}
.t10{background:var(--red);border-radius:.2rem;width:1.6rem;height:1.6rem;display:grid;place-items:center;font-size:.42rem;font-weight:800;line-height:1;text-align:center;color:#fff}
.hd{font-size:1.15rem;line-height:1.35;text-shadow:0 .1rem .4rem rgba(0,0,0,.7);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:1.1rem}
.hb{display:flex;gap:.8rem}
.b{display:flex;align-items:center;gap:.6rem;padding:.55rem 1.7rem .55rem 1.4rem;border-radius:.25rem;font-weight:700;font-size:1.1rem;transition:background .2s}
.b svg{width:1.5rem;height:1.5rem}
.b.w{background:#fff;color:#000}.b.w:hover{background:rgba(255,255,255,.75)}
.b.g{background:rgba(109,109,110,.7);color:#fff}.b.g:hover{background:rgba(109,109,110,.4)}
.hero-dots{position:absolute;z-index:4;bottom:1.5rem;left:50%;transform:translateX(-50%);display:flex;gap:.7rem;padding:.5rem .9rem;background:rgba(0,0,0,.35);border-radius:2rem;backdrop-filter:blur(4px)}
.hd2{width:.75rem;height:.75rem;border-radius:50%;background:rgba(255,255,255,.35);border:0;padding:0;cursor:pointer;transition:background .25s,transform .25s;box-shadow:0 0 8px rgba(0,0,0,.6)}
.hd2.on{background:#fff;transform:scale(1.3)}
.hd2:hover{background:rgba(255,255,255,.7)}
.ph{padding:calc(var(--nav) + 2rem) var(--pad) 1rem;font-size:2rem;font-weight:700}
.rows{position:relative;z-index:3;padding-bottom:5rem}
.hero+.rows{margin-top:-6vw}
.row{margin-bottom:1.6rem;position:relative}
.rt{font-size:1.2rem;font-weight:700;padding:0 var(--pad);margin-bottom:.6rem}
.sl{position:relative}
.tr{display:flex;gap:var(--gap);overflow-x:auto;padding:.4rem var(--pad);scrollbar-width:none;scroll-behavior:smooth}
.ar{position:absolute;top:.4rem;bottom:.4rem;width:var(--pad);z-index:5;background:rgba(20,20,20,.5);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.ar svg{width:2rem;height:2rem}
.ar.l{left:0}.ar.r{right:0}
@media(hover:hover){.ar{display:flex}.sl:hover .ar{opacity:1}.ar:hover{background:rgba(20,20,20,.75)}}
.tile{flex:0 0 auto;width:calc((100vw - 2*var(--pad) - (var(--per) - 1)*var(--gap))/var(--per));cursor:pointer;display:flex}
.tile.top{width:calc((100vw - 2*var(--pad) - (var(--pt) - 1)*var(--gap))/var(--pt))}
.art{position:relative;flex:1;aspect-ratio:2/3;border-radius:.3rem;overflow:hidden;background:#2a2a2a}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .fb{display:none;position:absolute;inset:0;padding:.6rem;align-items:flex-end;font-weight:700;background:linear-gradient(135deg,#3a3a3a,#1a1a1a)}
.art.fail .fb{display:flex}
.tile:focus-visible .art{box-shadow:0 0 0 3px #fff}
.tile:focus-visible{outline:0}
.top .art{flex:0 0 52%}
.num{flex:0 0 48%;height:100%;margin-right:-.4rem;width:48%;stroke-width:4;overflow:visible}
.num text{font-family:"Arial Black",Impact,sans-serif;font-weight:900;fill:#141414;stroke:#6d6d6d}
.grid{display:grid;grid-template-columns:repeat(var(--per),1fr);gap:2.2rem var(--gap);padding:0 var(--pad) 5rem}
.grid .tile{width:auto}
.empty{padding:0 var(--pad);color:#8c8c8c;font-size:1.1rem}
.pop{position:fixed;z-index:90;background:#181818;border-radius:.4rem;overflow:hidden;box-shadow:0 .3rem 1.6rem rgba(0,0,0,.8);opacity:0;transform:scale(.85);pointer-events:none;transition:transform .2s,opacity .2s}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop .art{aspect-ratio:3/4;border-radius:0;flex:none}
.pb{padding:.8rem 1rem 1rem}
.ac{display:flex;gap:.45rem;align-items:center}.ac .sp{margin-left:auto}
.cb{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(42,42,42,.6);display:grid;place-items:center;flex:none}
.cb:hover{border-color:#fff}.cb.w{background:#fff;border-color:#fff;color:#000}.cb.w:hover{background:#ddd}
.cb svg{width:1rem;height:1rem}
.mt{display:flex;align-items:center;gap:.5rem;font-size:.82rem;font-weight:600;margin:.7rem 0 .4rem;flex-wrap:wrap}
.mc{color:#46d369;font-weight:700}
.ag{border:1px solid rgba(255,255,255,.4);padding:0 .35rem;font-size:.72rem;color:#fff}
.gn{font-size:.8rem;display:flex;flex-wrap:wrap;gap:.2rem .5rem;color:#fff}
.gn i{font-style:normal;color:#646464}
.bar-load{display:inline-block;width:0;height:3px;background:linear-gradient(90deg,#e50914,rgba(229,9,20,0.2));border-radius:2px;vertical-align:middle;animation:barLoad 2.5s ease-out forwards}
@keyframes barLoad{0%{width:0;opacity:0}15%{opacity:1}70%{width:45px;opacity:1}100%{width:45px;opacity:0}}
.md{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);overflow-y:auto;display:none}
.md.on{display:block}
.sh{position:relative;width:min(54rem,94vw);margin:2rem auto 4rem;background:#181818;border-radius:.6rem;overflow:hidden;box-shadow:0 .6rem 3rem #000;animation:si .3s}
@keyframes si{from{transform:translateY(2rem);opacity:0}}
.sv{position:relative;aspect-ratio:16/9;overflow:hidden;background:#222}
.sv .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(24px) brightness(.55)}
.sv .pst{position:absolute;right:8%;top:8%;height:84%;aspect-ratio:2/3;border-radius:.3rem;object-fit:cover;box-shadow:0 .4rem 2rem #000}
.sv>.bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#181818)}
.sc{position:absolute;z-index:3;top:1rem;right:1rem;width:2.3rem;height:2.3rem;border-radius:50%;background:#181818;display:grid;place-items:center}
.sx{position:absolute;z-index:2;left:2.5rem;bottom:1.6rem;right:45%}
.sx .ht{font-size:clamp(2rem,4vw,4rem)}
.sb2{display:grid;grid-template-columns:2fr 1fr;gap:2rem;padding:0 2.5rem 2.5rem}
.sb2 p{font-size:.95rem;line-height:1.5;margin-top:.8rem}
.sb2 small{display:block;font-size:.85rem;margin-bottom:.8rem;color:#777}.sb2 small span{color:#fff}
@media(max-width:700px){.sb2{grid-template-columns:1fr}.sx{right:1rem;left:1rem}.sv .pst{display:none}}
/* GRID DE TEMPORADAS */
.seasons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.8rem;margin:.5rem 0 1.5rem}
.season-card{background:#2a2a2a;border-radius:.4rem;padding:1rem;cursor:pointer;display:flex;align-items:center;gap:.8rem;transition:background .2s,transform .2s,border-color .2s;border:2px solid transparent}
.season-card:hover,.season-card:focus{background:#3a3a3a;border-color:var(--red);outline:none;transform:scale(1.02)}
.season-num{font-family:'Bebas Neue',Impact,sans-serif;font-size:2.2rem;color:var(--red);line-height:1;min-width:2rem;text-align:center}
.season-info{display:flex;flex-direction:column;gap:.15rem;overflow:hidden}
.season-info b{font-size:.95rem;color:#fff}
.season-info span{font-size:.72rem;color:#888}
/* REPRODUCTOR */
#play{background:#000;z-index:300}
#play iframe{width:100%;height:100%;border:0}
.pbk{position:absolute;top:1.4rem;left:1.4rem;z-index:5;display:flex;align-items:center;gap:.8rem;padding:.6rem 1.1rem;background:rgba(0,0,0,.7);border-radius:.3rem;font-weight:700;transition:opacity .4s}
.pbk.hide{opacity:0}.pbk:hover,.pbk:focus{background:rgba(255,255,255,.2)}
.next-ep{position:absolute;bottom:1.5rem;right:1.5rem;z-index:5;display:none;align-items:center;gap:.6rem;padding:.75rem 1.3rem;background:rgba(229,9,20,.95);color:#fff;border:0;border-radius:.3rem;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;opacity:0;transition:opacity .3s;box-shadow:0 .2rem 1rem rgba(0,0,0,.6)}
.next-ep.show{display:flex;opacity:1}
.next-ep:hover,.next-ep:focus{background:#ff0d1a;outline:2px solid #fff}
.next-ep svg{width:1.1rem;height:1.1rem;fill:#fff;stroke:none}
.av .fc{position:absolute;inset:0;width:100%;height:100%}
.ed{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;font-style:normal}.ed svg{width:2.4rem;height:2.4rem}
.add .av{background:none;color:grey;border:0}.add .av svg{width:55%;height:55%;stroke-width:1.2}.add:hover .av,.add:focus .av{background:#e5e5e5;color:#141414}
.hr{display:flex;align-items:center;gap:.8rem;background:none;border:0;padding:0;position:absolute;z-index:2;right:0;bottom:36%;padding-right:0}
.hr span{background:rgba(51,51,51,.6);border-left:3px solid #dcdcdc;padding:.5rem 3.6vw .5rem .8rem;font-size:1.1rem}
.mu{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid rgba(255,255,255,.7);display:grid;place-items:center;background:rgba(0,0,0,.25)}
.mu:hover,.mu:focus{background:rgba(255,255,255,.15);border-color:#fff}
.nt{min-width:23rem;max-height:70vh;overflow:auto}.mn.nt button{align-items:center}.nt small{color:#808080}
.nth{width:6rem;aspect-ratio:16/9;object-fit:cover;border-radius:.2rem;flex:none;background:#333}
.rt{display:flex;align-items:center}
.ex{font-size:.8rem;color:#54b9c5;margin-left:1rem;opacity:0;transform:translateX(-.5rem);transition:.3s;display:flex;align-items:center;font-weight:700;cursor:pointer}
.ex svg{width:.9rem;height:.9rem}.row:hover .ex{opacity:1;transform:none}
.nb{position:absolute;top:.3rem;left:.45rem;font-family:'Bebas Neue',Impact,sans-serif;color:var(--red);font-size:1.5rem;line-height:1;text-shadow:0 0 .4rem rgba(0,0,0,.9)}
.nw{position:absolute;left:50%;bottom:.45rem;transform:translateX(-50%);background:var(--red);color:#fff;font-size:.62rem;font-weight:700;padding:.15rem .45rem;border-radius:.15rem;white-space:nowrap}
.prg{position:absolute;left:0;right:0;bottom:0;height:.25rem;background:#4d4d4d}.prg i{display:block;height:100%;background:var(--red)}
.xt{padding:0 2.5rem 2.5rem}.xh{font-size:1.4rem;margin:1.6rem 0 .8rem}
.ep{display:flex;align-items:center;gap:1.2rem;padding:1rem;border-radius:.3rem;background:#333;cursor:pointer}.ep:hover,.ep:focus{background:#444}
.en{font-size:1.6rem;color:#d2d2d2;width:2rem;text-align:center}
.et{position:relative;width:9rem;aspect-ratio:16/9;flex:none;border-radius:.3rem;overflow:hidden;background:#222}.et img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ei{flex:1}.ei div{display:flex;justify-content:space-between;gap:1rem}.ei p{font-size:.85rem;color:#d2d2d2;margin-top:.4rem;line-height:1.4}
.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.sc2{background:#2f2f2f;border-radius:.3rem;overflow:hidden;cursor:pointer}.sc2:focus{outline:3px solid #fff}
.sc2 .art{aspect-ratio:3/4;border-radius:0;flex:none}.cm{padding:.8rem}.cm b{display:block;font-size:.9rem}.cm span{color:#bcbcbc;font-size:.78rem}
.cm p{font-size:.8rem;color:#d2d2d2;margin-top:.4rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ab{font-size:.9rem;line-height:1.9;color:#777}.ab span{color:#fff}
.ft{padding:3rem var(--pad) 4rem;color:grey;max-width:70rem;margin:0 auto;font-size:.82rem}
.fl{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem 1.5rem;margin:1.2rem 0}.fl a{cursor:pointer}.fl a:hover{text-decoration:underline}
.sc3{border:1px solid grey;color:grey;padding:.5rem 1rem;margin:.5rem 0 1rem}.sc3:hover{color:#fff}
@media(max-width:900px){.nl[data-v=nuevo],.nl[data-v=kids]{display:none}}
@media(max-width:700px){.sim{grid-template-columns:repeat(2,1fr)}.xt{padding:0 1rem 1.5rem}.et{width:6rem}.fl{grid-template-columns:repeat(2,1fr)}.nt{min-width:16rem}}

/* overlays: editor de perfil y PIN */
.ov{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;overflow:auto;padding:1rem}.ov.on{display:flex}
.bx{background:#181818;border-radius:.5rem;padding:2rem 2.4rem;width:min(34rem,94vw);box-shadow:0 .6rem 3rem #000;margin:auto}
.bx h2{font-size:1.6rem;margin-bottom:1.2rem}
.bx label{display:block;font-size:.85rem;color:#a3a3a3;margin:1rem 0 .4rem}
.bx input{width:100%;background:#333;border:1px solid #555;color:#fff;font:inherit;font-size:1.05rem;padding:.7rem .9rem;border-radius:.25rem}
.pv{display:flex;align-items:flex-end;gap:1.2rem}.pv .av{width:5rem;height:5rem;font-size:1rem}
.swt{display:flex;gap:.6rem;flex-wrap:wrap}.swt button{width:2.6rem;height:2.6rem;border-radius:.25rem;border:3px solid transparent}.swt button.on{border-color:#fff}
.row2{display:flex;gap:.8rem;margin-top:1.6rem;flex-wrap:wrap}
.bt{padding:.7rem 1.6rem;border-radius:.25rem;font-weight:700;background:#333;color:#fff;font-size:1rem}.bt.p{background:#fff;color:#000}.bt.d{background:#9b1c24}
.bt:hover,.bt:focus{filter:brightness(1.25)}
.dots{display:flex;gap:1rem;justify-content:center;margin:1rem 0 1rem}.dots i{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid #888}.dots i.f{background:#fff;border-color:#fff}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.kp button{padding:1rem 0;background:#2a2a2a;border-radius:.3rem;font-size:1.4rem;font-weight:700}.kp button:hover,.kp button:focus{background:#444}.kp button[data-k=b],.kp button[data-k=x]{font-size:.95rem}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
.msg{min-height:1.4rem;color:#e87c03;font-size:.9rem;margin-top:.6rem}
/* historial */
.hl{padding:0 var(--pad) 5rem;display:flex;flex-direction:column;gap:.8rem;max-width:62rem}
.he{display:flex;align-items:center;gap:1.2rem;background:#222;border-radius:.4rem;padding:.8rem 1rem}
.hth{width:4.2rem;flex:none}.hth .art{border-radius:.2rem}
.hf{flex:1;min-width:0}.hf b{display:block;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hf span{font-size:.85rem;color:#a3a3a3}
/* modo reposo */
#idle{position:fixed;inset:0;z-index:450;background:#000;display:none;overflow:hidden}#idle.on{display:block}
.is{position:absolute;inset:0;opacity:0;filter:blur(16px);transition:opacity 1.1s ease,filter 1.1s ease}.is.on{opacity:1;filter:none}
.is .bgb{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(32px) brightness(.4)}

.hint{position:absolute;z-index:3;bottom:1.4rem;left:50%;transform:translateX(-50%);font-size:.85rem;color:#9a9a9a}

function extras(i,box){
  let h='';
  const o=ITEMS.filter(x=>x!==i);
  if(i.seasons){
    h+='<h3 class="xh">Elegí una temporada</h3><div class="seasons-grid"></div>';
  } else if(i.type==='serie'){
    h+=`<h3 class="xh">Episodios</h3><div class="ep" data-f tabindex="0" role="button"><span class="en">1</span><div class="et"></div><div class="ei"><div><b>Episodio 1</b><span>${i.duration}</span></div><p>${i.description}</p></div></div>`;
  }
  if(o.length)h+='<h3 class="xh">Más títulos similares</h3><div class="sim"></div>';
  h+=`<h3 class="xh">Acerca de <b>${i.title}</b></h3><p class="ab">Géneros: <span>${i.genres.join(', ')}</span><br>Año: <span>${i.year}</span><br>Clasificación por edad: <span>${i.rating}</span></p>`;
  box.innerHTML=h;
  if(i.seasons){
    const sg=box.querySelector('.seasons-grid');
    i.seasons.forEach(s=>{
      const card=el(`<div class="season-card" data-f tabindex="0" role="button">
        <div class="season-num">${s.n}</div>
        <div class="season-info">
          <b>${s.label}</b>
          <span>${s.duration||s.episodes.length+' episodios'}</span>
          <span>${s.year}</span>
        </div>
      </div>`);
      card.onclick=()=>playSeason(i,s);
      card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();playSeason(i,s)}};
      sg.appendChild(card);
    });
  } else if(i.type==='serie'){
    const ep=box.querySelector('.ep');
    if(ep){ep.querySelector('.et').append(img(i.backdrop||i.poster,'',1));ep.onclick=()=>play(i);ep.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();play(i)}}}
  }
  const sm=box.querySelector('.sim');
  if(sm)o.forEach(x=>{const c=el(`<div class="sc2" data-f tabindex="0" role="button"><div class="ci"></div><div class="cm"><b>${x.title}</b><span>${x.duration}</span><p>${x.description}</p></div></div>`);
   c.querySelector('.ci').append(art(x));c.onclick=()=>{openMd(x)};c.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openMd(x)}};sm.append(c)});
}
const H=()=>store.g('hist',[]).map(x=>typeof x==='string'?{id:x,at:0}:x).filter(x=>byId(x.id));
function rec(i,sn,ep){const h=H().filter(x=>x.id!==i.id);h.unshift({id:i.id,at:Date.now(),s:sn||null,e:ep||null});store.s('hist',h.slice(0,50))}
function ago(t){if(!t)return'';const m=Math.floor((Date.now()-t)/6e4);return m<1?'hace un momento':m<60?'hace '+m+' min':m<1440?'hace '+Math.floor(m/60)+' h':'hace '+Math.floor(m/1440)+' d'}
const CL={'TP':'Apta para todo público','PG':'Se recomienda guía de los padres','TV-PG':'Se recomienda guía de los padres','PG-13':'No recomendada para menores de 13 años','13+':'No recomendada para menores de 13 años','TV-14':'No recomendada para menores de 14 años','15+':'No recomendada para menores de 15 años','16+':'No recomendada para menores de 16 años','18+':'Solo para adultos'};

 const pi=$('#pinfo');pi.innerHTML=`<div class="r1"><span class="ag">${i.rating}</span><span>${CL[i.rating]||''}</span></div>${c.length?`<p>Contiene: <b>${c.join(', ')}</b></p>`:(i.rating==='TP'?'<p>Sin advertencias de contenido</p>':'')}`;
 pi.classList.add('show');clearTimeout(infoT);infoT=setTimeout(()=>pi.classList.remove('show'),9000)}

function logo(box){box.innerHTML=`<img src="${LOGO}" alt="Netflix">`;box.firstChild.onerror=function(){box.innerHTML='<span class="wm">NETFLIX</span>'}}
function img(srcs,alt,eager){const l=[].concat(srcs||[]),m=new Image();let n=0;m.alt=alt;m.draggable=false;m.referrerPolicy='no-referrer';if(!eager)m.loading='lazy';
 m.onerror=()=>{if(++n<l.length)m.src=l[n];else{m.remove();(m._p||{classList:{add(){}}}).classList.add('fail')}};if(l.length)m.src=l[0];return m}
function art(i,cls){const a=document.createElement('div');a.className='art '+(cls||'');a.innerHTML=`<span class="fb">${i.title}</span>`;const m=img(i.poster,i.title);m._p=a;a.prepend(m);return a}

  b.onclick=()=>manage?editP(p):enter(p);g.appendChild(b)});
 if(PROFILES.length<5){const a=document.createElement('button');a.className='pi add';a.dataset.f=1;a.innerHTML=`<div class="av">${I.plus}</div><span>Agregar perfil</span>`;a.onclick=()=>editP();g.appendChild(a)}
 $('#bm').textContent=manage?'Listo':'Administrar perfiles';$('#prof h1').textContent=manage?'Administrar perfiles:':'¿Quién está viendo ahora?'}
function buildMenu(){const p=profile;$('#hmt').innerHTML=avatar(p)+I.down;

 $$('#mn [data-p]').forEach(b=>b.onclick=()=>{closeMenu();enter(PROFILES[b.dataset.p])});

function enter(p,ok){if(p.pin&&!ok){askPin(p,()=>enter(p,true));return}

const ov=$('#ov');let ovFocus=null;

const IDLEOPT=[1,2,3,5,10,0],idlTxt=m=>m?m+' min':'Nunca';
function openOv(){ovFocus=document.activeElement;ov.classList.add('on');focusFirst(ov)}
function closeOv(){ov.classList.remove('on');ov._press=null;ov.onclick=null;ov.innerHTML='';if(ovFocus&&document.contains(ovFocus))ovFocus.focus({preventScroll:true});else focusFirst($('#prof').classList.contains('on')?$('#prof'):$('#app'))}
function editP(p){const nw=!p,d=p?{...p,c:[...p.c]}:{id:Date.now(),name:'',c:SW[PROFILES.length%SW.length],img:'',pin:'',idle:2};if(d.idle===undefined)d.idle=2;
 ov.innerHTML=`<div class="bx"><h2>${nw?'Agregar perfil':'Editar perfil'}</h2><div class="pv"><div id="pva"></div><div style="flex:1"><label style="margin:0 0 .4rem">Nombre</label><input data-f id="pn" maxlength="14" value="${esc(d.name)}"></div></div>
 <label>Color del avatar</label><div class="swt" id="psw"></div>
 <label>PIN de 4 dígitos (vacío = sin PIN)</label><input data-f id="pp" type="password" inputmode="numeric" maxlength="4" value="${esc(d.pin||'')}">
 <label>Entrar en reposo (banners) tras</label><button class="bt" data-f id="pi">${idlTxt(d.idle)}</button>
 <p class="msg" id="pm"></p><div class="row2"><button class="bt p" data-f id="ps">Guardar</button><button class="bt" data-f id="pc">Cancelar</button>${!nw&&PROFILES.length>1?'<button class="bt d" data-f id="pd">Eliminar perfil</button>':''}</div></div>`;
 const pv=()=>$('#pva').innerHTML=avatar(d);pv();
 SW.forEach(c=>{const b=el(`<button data-f style="background:linear-gradient(135deg,${c[0]},${c[1]})" aria-label="Color"></button>`);b.classList.toggle('on',!d.img&&d.c[0]===c[0]);
  b.onclick=()=>{d.c=c;d.img='';$$('#psw button').forEach(x=>x.classList.remove('on'));b.classList.add('on');pv()};$('#psw').append(b)});
 $('#pi').onclick=()=>{d.idle=IDLEOPT[(IDLEOPT.indexOf(d.idle)+1)%IDLEOPT.length];$('#pi').textContent=idlTxt(d.idle)};
 $('#pc').onclick=closeOv;
 $('#ps').onclick=()=>{const n=esc($('#pn').value.trim()),pin=$('#pp').value.trim();
  if(!n){$('#pm').textContent='Escribe un nombre.';return}
  if(pin&&!/^\d{4}$/.test(pin)){$('#pm').textContent='El PIN debe tener exactamente 4 números.';return}

const idle=$('#idle');let last=Date.now(),idleOn=false,idleT,idleN=0,idleList=[],idleCur=null;
function act(){last=Date.now()}
['mousemove','keydown','mousedown','touchstart','wheel','scroll'].forEach(e=>addEventListener(e,()=>{if(!idleOn)act()},{passive:true,capture:true}));
function canIdle(){return $('#app').classList.contains('on')&&view==='home'&&!md.classList.contains('on')&&!pl.classList.contains('on')&&!ov.classList.contains('on')&&!q.value}
function loadOk(d){return new Promise(r=>{const m=new Image();m.referrerPolicy='no-referrer';m.onload=()=>r(d);m.onerror=()=>r(null);m.src=d.img;setTimeout(()=>r(null),8000)})}
let starting=false;
async function startIdle(){if(starting)return;starting=true;const ok=(await Promise.all(IDLE.filter(d=>byId(d.id)).map(loadOk))).filter(Boolean);starting=false;
 if(!ok.length||!canIdle())return;idleList=ok;idleN=0;idleOn=true;hidePop();idle.innerHTML='<div class="hint">Pulsa cualquier tecla para salir</div>';idle.classList.add('on');idleShow();idleT=setInterval(()=>{idleN=(idleN+1)%idleList.length;idleShow()},7000)}
function idleShow(){const d=idleList[idleN],i=byId(d.id);idleCur=i;
 const s=el(`<div class="is"><img class="bgb" src="${d.img}" alt="" referrerpolicy="no-referrer"><img class="fgb" src="${d.img}" alt="${i.title}" referrerpolicy="no-referrer"><div class="info"><div class="tag"><b>N</b>${i.type==='serie'?'SERIE':'PELÍCULA'}</div><h1 class="ht">${i.title}</h1><div class="rb">${i.rating}</div>
 <div class="mt"><span class="mc">${i.match}% para ti</span><span>${i.year}</span><span>${i.duration}</span></div><div class="gn">${i.genres.slice(0,4).map(g=>`<span>${g}</span>`).join('<i>•</i>')}</div><p class="hd">${i.description}</p>
 <div class="hb"><button class="b w vn">${I.play}Ver ahora</button></div></div></div>`);
 idle.append(s);requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')));
 idle.querySelectorAll('.is').forEach(o=>{if(o!==s){o.classList.remove('on');setTimeout(()=>o.remove(),1300)}})}
function stopIdle(go2){clearInterval(idleT);idleOn=false;idle.classList.remove('on');setTimeout(()=>{if(!idleOn)idle.innerHTML=''},1300);act();if(go2)play(idleCur)}
idle.onclick=e=>stopIdle(!!e.target.closest('.vn'));
addEventListener('keydown',e=>{if(!idleOn)return;e.preventDefault();e.stopImmediatePropagation();stopIdle(e.key==='Enter')},true);
setInterval(()=>{if(idleOn||!canIdle())return;const m=profile.idle===undefined?2:profile.idle;if(m&&Date.now()-last>=m*60000)startIdle()},4000);
renderProfiles();
setTimeout(()=>{screen('prof');focusFirst($('#prof'))},2500);
